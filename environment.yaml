name: pregan_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # 1. Python 基础
  - python=3.10
  - pip

  # 2. 核心深度学习框架 (PyTorch 依然用 Conda 装，比较稳)
  - pytorch::pytorch=2.2.2
  - torchvision
  
  # 3. 科学计算栈
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - cython
  - joblib
  
  # 4. 工具库
  - tqdm
  - pillow
  - python-dateutil
  - pytz
  - six
  - kiwisolver
  - certifi

  # 5. Pip 专属安装 (DGL 移到这里)
  - pip:
    - dgl=2.2.1             # Pip 会自动拉取适配 Mac 的 whl 包
    - influxdb
    - wget
    - SciencePlots
    - future
